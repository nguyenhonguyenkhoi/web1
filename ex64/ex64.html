<html>
<head>
    <meta charset="utf-8" />
    <title>Bài 64 - Dynamic Table</title>
    <style type="text/css">
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; cursor: pointer; }
        td { padding: 8px; }
        button { padding: 5px 10px; margin-right: 5px; cursor: pointer; }
        
        #clock { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: blue; }
        #mouse-detect { 
            background-color: #f0f0f0; 
            padding: 10px; 
            border: 1px dashed #ccc; 
            margin-bottom: 15px; 
            display: inline-block;
        }
    </style>
    <script>
        function startClock() {
            setInterval(function() {
                var now = new Date();
                var h = now.getHours();
                var m = now.getMinutes();
                var s = now.getSeconds();
                
                h = h < 10 ? "0" + h : h;
                m = m < 10 ? "0" + m : m;
                s = s < 10 ? "0" + s : s;
                
                document.getElementById("clock").innerText = h + ":" + m + ":" + s;
            }, 1000); 
        }

        function detectMouse(event) {
            if (event.button === 0) {
                alert("Bạn vừa click chuột TRÁI!");
            } else if (event.button === 2) {
                alert("Bạn vừa click chuột PHẢI!");
            }
        }

        function toggleRow(tr) {
            if (tr.style.backgroundColor === "red") {
                tr.style.backgroundColor = ""; // Bỏ tô đỏ nếu đang đỏ
            } else {
                tr.style.backgroundColor = "red"; // Tô đỏ
            }
        }

        var rowCount = 3;
        function addRow() {
            rowCount++;
            var tbody = document.getElementById("myTbody");
            var tr = document.createElement("tr");
            
            tr.onclick = function() { toggleRow(this); };

            var td1 = document.createElement("td");
            td1.innerText = "Dòng " + rowCount + " cột 1";
            tr.appendChild(td1);

            var td2 = document.createElement("td");
            td2.innerText = "Dòng " + rowCount + " cột 2";
            tr.appendChild(td2);

            tbody.appendChild(tr);
        }

        function deleteRow() {
            var tbody = document.getElementById("myTbody");
            for (var i = tbody.rows.length - 1; i >= 0; i--) {
                if (tbody.rows[i].style.backgroundColor === "red") {
                    tbody.deleteRow(i);
                }
            }
        }

        function showRowsOnly() {
            document.getElementById("myTable").rules = "rows";
        }
        
        function showColsOnly() {
            document.getElementById("myTable").rules = "cols";
        }

        function openNewPage() {
            window.open("https://tranduythanh.com/", "_blank");
        }
    </script>
</head>
<body onload="startClock()">

    <div id="clock">00:00:00</div>

    <div id="mouse-detect" onmousedown="detectMouse(event)" oncontextmenu="return false;">
        Click chuột vào dòng này. Sẽ xuất hiện thông báo phím bấm của chuột
    </div>

    <table id="myTable" border="1" rules="all">
        <tbody id="myTbody">
            <tr onclick="toggleRow(this)">
                <td>Dòng 1 cột 1</td>
                <td>Dòng 1 cột 2</td>
            </tr>
            <tr onclick="toggleRow(this)">
                <td>Dòng 2 cột 1</td>
                <td>Dòng 2 cột 2</td>
            </tr>
            <tr onclick="toggleRow(this)">
                <td>Dòng 3 cột 1</td>
                <td>Dòng 3 cột 2</td>
            </tr>
        </tbody>
    </table>

    <div>
        <button onclick="addRow()">Thêm vào</button>
        <button onclick="deleteRow()">Xoá</button>
        <button onclick="showRowsOnly()">Chỉ hiện dòng</button>
        <button onclick="showColsOnly()">Chỉ hiện cột</button>
        <button onclick="openNewPage()">Mở một trang mới</button>
    </div>

</body>
</html>
